name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repo and runs local test scripts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials: false — the globbed test scripts run local git in
      # temp dirs and never need the GITHUB_TOKEN, so don't leave it in git config.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Hook tests
        # Glob so new tests/hooks/caliper-test_*.sh auto-enroll — manual
        # enumeration had silently orphaned caliper-test_deny_plan_md.sh from CI.
        run: |
          for t in tests/hooks/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      - name: Bin tests
        # Glob so new tests/bin/caliper-test_*.sh auto-enroll.
        run: |
          for t in tests/bin/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      - name: Skill lint tests
        # Glob so new tests/skills/caliper-test_*.sh auto-enroll.
        run: |
          for t in tests/skills/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      - name: Handoff tests
        # Glob so new tests/handoff/caliper-test_*.sh auto-enroll. They fake
        # osascript, so they run on Linux too.
        run: |
          for t in tests/handoff/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      - name: CI script tests
        # Glob so new tests/ci/caliper-test_*.sh auto-enroll.
        run: |
          for t in tests/ci/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      - name: Validate-plan tests
        # Glob so new tests/validate-plan/caliper-test_*.sh auto-enroll — the
        # enumerated list had left most suites for bin/validate-plan out of CI.
        run: |
          for t in tests/validate-plan/caliper-test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

  version-bump:
    # A PR that changes shipped files must declare a version above the base
    # branch's current tip, or users stay on a stale plugin cache.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 so origin/<base> and the merge-base are present; the
      # checked-out ref is the PR merged into the current base tip.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-version-bump "origin/$BASE_REF"
